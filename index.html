<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Змейка</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="game-wrapper">
        <h1 class="game-title">Змейка</h1>

        <div class="score-board">
            <div class="score-board__item">
                <span class="score-board__label">Счёт</span>
                <span class="score-board__value" id="score">0</span>
            </div>
            <div class="score-board__item">
                <span class="score-board__label">Рекорд</span>
                <span class="score-board__value" id="highScore">0</span>
            </div>
            <div class="score-board__item">
                <span class="score-board__label">Монетки</span>
                <span class="score-board__value coins" id="coins">0</span>
            </div>
        </div>

        <div class="game-container">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="game-overlay" id="overlay">
                <p class="overlay__title" id="overlayTitle">Змейка</p>
                <p class="overlay__subtitle" id="overlaySubtitle">Нажмите Пробел или кликните для начала</p>
                <button class="btn btn--revive" id="reviveBtn" style="display:none;">✦ Возродить (10 &#9830;)</button>
            </div>
        </div>

        <div class="controls-hint">
            <p>Управление: <strong>WASD</strong> или <strong>стрелки</strong> &nbsp;|&nbsp; <strong>Пробел</strong> — старт / пауза</p>
        </div>
    </div>

    <script src="scripts/script.js"></script>
</body>
</html>
